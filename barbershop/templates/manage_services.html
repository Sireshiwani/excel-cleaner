{% extends "base.html" %}
{% block content %}
<h1 class="font-sans text-3xl font-bold">Manage Services</h1>

<form class="mt-6 grid gap-3 rounded-xl border border-gccharcoal bg-gccharcoal/40 p-4 md:grid-cols-4" method="post">
  <input required name="name" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Service name" />
  <input required name="category" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Category" />
  <input required name="price" type="number" step="0.01" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Price" />
  <button class="rounded bg-gcbronze px-4 py-2 font-sans font-bold text-black">Add Service</button>
  <textarea name="description" rows="2" class="rounded border border-gccharcoal bg-black px-3 py-2 md:col-span-4" placeholder="Description"></textarea>
</form>

<div class="mt-6 overflow-x-auto rounded-xl border border-gccharcoal">
  <table class="w-full text-sm">
    <thead class="bg-gccharcoal text-left text-gray-300"><tr><th class="p-2">Name</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead>
    <tbody>
      {% for service in services %}
      <tr class="border-t border-gccharcoal">
        <td class="p-2">{{ service.name }}</td>
        <td>{{ service.category }}</td>
        <td>${{ '%.2f'|format(service.price) }}</td>
        <td>
          <form class="inline" method="post" action="{{ url_for('main.delete_service', service_id=service.id) }}">
            <button class="rounded bg-red-800 px-2 py-1">Delete</button>
          </form>
        </td>
      </tr>
      <tr class="border-b border-gccharcoal bg-black/40">
        <td colspan="4" class="p-2">
          <form class="grid gap-2 md:grid-cols-4" method="post" action="{{ url_for('main.edit_service', service_id=service.id) }}">
            <input required name="name" value="{{ service.name }}" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <input required name="category" value="{{ service.category }}" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <input required name="price" type="number" step="0.01" value="{{ '%.2f'|format(service.price) }}" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <button class="rounded bg-gcbronze px-2 py-1 font-sans font-bold text-black">Update</button>
            <textarea name="description" rows="2" class="rounded border border-gccharcoal bg-black px-2 py-1 md:col-span-4">{{ service.description }}</textarea>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
