{% extends "base.html" %}
{% block content %}
<h1 class="font-sans text-3xl font-bold">Manage Staff</h1>

<form class="mt-6 grid gap-3 rounded-xl border border-gccharcoal bg-gccharcoal/40 p-4 md:grid-cols-3" method="post">
  <input required name="name" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Name" />
  <select name="role" class="rounded border border-gccharcoal bg-black px-3 py-2">
    <option value="staff">Staff</option>
    <option value="manager">Manager</option>
    <option value="admin">Admin</option>
  </select>
  <input required name="commission_rate" type="number" step="0.01" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Commission %" />
  <input required name="email" type="email" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Email" />
  <input required name="password" type="password" class="rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Temp password" />
  <button class="rounded bg-gcbronze px-4 py-2 font-sans font-bold text-black">Add Staff</button>
</form>

<div class="mt-6 overflow-x-auto rounded-xl border border-gccharcoal">
  <table class="w-full text-sm">
    <thead class="bg-gccharcoal text-left text-gray-300"><tr><th class="p-2">Name</th><th>Email</th><th>Role</th><th>Comm %</th><th>Actions</th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr class="border-t border-gccharcoal">
        <td class="p-2">{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td class="uppercase text-gcgold">{{ user.role }}</td>
        <td>{{ '%.0f'|format(user.commission_rate * 100) }}</td>
        <td>
          <form class="inline" method="post" action="{{ url_for('main.delete_staff', user_id=user.id) }}">
            <button class="rounded bg-red-800 px-2 py-1">Delete</button>
          </form>
        </td>
      </tr>
      <tr class="border-b border-gccharcoal bg-black/40">
        <td colspan="5" class="p-2">
          <form class="grid gap-2 md:grid-cols-6" method="post" action="{{ url_for('main.edit_staff', user_id=user.id) }}">
            <input required name="name" value="{{ user.name }}" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <input required name="email" type="email" value="{{ user.email }}" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <select name="role" class="rounded border border-gccharcoal bg-black px-2 py-1">
              {% for role in ['admin','manager','staff'] %}
                <option value="{{ role }}" {% if role == user.role %}selected{% endif %}>{{ role }}</option>
              {% endfor %}
            </select>
            <input required name="commission_rate" type="number" step="0.01" value="{{ '%.2f'|format(user.commission_rate * 100) }}" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <input name="password" type="password" placeholder="New password (optional)" class="rounded border border-gccharcoal bg-black px-2 py-1" />
            <button class="rounded bg-gcbronze px-2 py-1 font-sans font-bold text-black">Update</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
