{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-gccharcoal bg-gccharcoal/40 p-8">
  <h1 class="font-sans text-3xl font-bold">Staff Login</h1>
  <p class="mt-2 text-sm text-gray-400">Authorized personnel only.</p>
  <form class="mt-6 space-y-4" method="post">
    <input name="email" type="email" required class="w-full rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Email" />
    <input name="password" type="password" required class="w-full rounded border border-gccharcoal bg-black px-3 py-2" placeholder="Password" />
    <button class="w-full rounded bg-gcbronze px-5 py-3 font-sans font-bold text-black hover:bg-gcgold">Login</button>
  </form>
</div>
{% endblock %}
